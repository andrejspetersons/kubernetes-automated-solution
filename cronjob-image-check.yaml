apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-check-service-job
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: image-check-service-trigger
              image: curlimages/curl
              command:
                - sh
                - -c
                - |
                  curl -X POST http://image-check-service:3000/run-check \
                  -H "Content-Type: application/json" \
                  -d '{"namespace":"node-server-app"}'
          restartPolicy: OnFailure