apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-patch-deployment
  namespace: auto-patch-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-patch
  template:
    metadata:
      labels:
        app: auto-patch
    spec:
      containers:
        - name: auto-patch-container
          image: andrejp02/auto-patch-image
          ports:
          - containerPort: 13000
---
apiVersion: v1
kind: Service
metadata:
  name: auto-patch-service
  namespace: auto-patch-namespace
  labels:
    app: auto-patch
spec:
  selector:
    app: auto-patch
  ports:
    - name: web
      port: 13000
      targetPort: 13000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auto-patch-server-monitor
  namespace: auto-patch-namespace
spec:
  selector:
    matchLabels:
      app: auto-patch
  endpoints:
    - port: web
      interval: 15s
      path: /metrics
